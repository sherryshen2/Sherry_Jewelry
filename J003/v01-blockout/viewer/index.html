<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J003 · 心形戒指草模核对</title>
<script type="module" src="./vendor/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ef;color:#3f3835;font:15px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1140px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:start;gap:24px}h1{font:500 30px/1.3 Georgia,serif;margin:6px 0 10px}p{margin:4px 0}.eyebrow{font-size:12px;letter-spacing:2px;color:#926950}.badge{border:1px solid #cda283;border-radius:25px;padding:6px 14px;font-size:13px;white-space:nowrap;color:#8c6047}.grid{display:grid;grid-template-columns:1fr 260px;gap:28px;margin-top:22px}.viewport{border:1px solid #e5dcd5;border-radius:20px;overflow:hidden;background:linear-gradient(140deg,#faf8f5,#e3dad3);position:relative}model-viewer{width:100%;height:570px;--progress-bar-color:#ae7b60;touch-action:none}.status{position:absolute;bottom:15px;left:18px;font-size:12px;color:#76645a;pointer-events:none}.panel{padding-top:10px}h2{font-size:14px;font-weight:600;margin:16px 0 8px}.buttons{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;cursor:pointer;border:1px solid #d5c6bb;background:#fffaf6;padding:8px 13px;border-radius:9px;color:inherit}button:hover,button[aria-pressed=true]{background:#956e56;color:white;border-color:#956e56}.note{background:#eee5dc;padding:15px;border-radius:12px;font-size:13px;margin-top:24px}.metric{border-bottom:1px solid #e2d8d0;padding:10px 0}.metric b{font-size:22px;font-weight:500}.small{font-size:12px;color:#80716a}a{color:#8b5e44}footer{font-size:12px;color:#857369;margin-top:18px}@media(max-width:760px){main{padding:20px}.grid{grid-template-columns:1fr}.panel{padding:0}model-viewer{height:480px}header{gap:12px}h1{font-size:24px}}
</style></head><body><main><header><div><div class="eyebrow">JEWELRY SHOP · J003 / V01</div><h1>粉色心形戒指</h1><p>结构草模核对 · 拖动旋转，滚轮或双指缩放</p></div><span class="badge">待确认 · 非正式商品模型</span></header>
<div class="grid"><div class="viewport"><model-viewer id="ring" src="../J003-blockout-v01.glb" alt="J003 玫瑰金粉色心形戒指结构草模" camera-controls camera-target="0m 0m 0m" camera-orbit="34deg 54deg 0.055m" field-of-view="30deg" min-camera-orbit="auto 0deg 0.035m" max-camera-orbit="auto 180deg 0.10m" min-field-of-view="25deg" max-field-of-view="40deg" exposure="1" shadow-intensity="0" interaction-prompt="none" tone-mapping="neutral"></model-viewer><div class="status" id="status" role="status">正在加载草模…</div></div><aside class="panel"><h2>观察角度</h2><div class="buttons" id="views"><button data-orbit="34deg 54deg 0.055m" aria-pressed="true">45°</button><button data-orbit="0deg 0deg 0.055m">正面</button><button data-orbit="90deg 90deg 0.055m">侧面</button><button data-orbit="180deg 90deg 0.055m">背面</button><button data-orbit="0deg 120deg 0.060m">底部</button></div><h2>缩放</h2><div class="buttons"><button id="in">放大</button><button id="out">缩小</button><button id="reset">复位</button></div><div class="metric"><b>16.00 mm</b><div class="small">用户指定戒圈内径</div></div><div class="metric" id="dimensions">外包尺寸加载中…</div><div class="metric" id="stats">模型信息加载中…</div><div class="note">已确认：心形主石、心形光环、戒臂镶石与三处主爪。<br><br>待确认：辅石总数、具体切面、底托背面与连接细节。尺寸除内径外均为比例估算。</div></aside></div>
<footer>本地草模查看器 · 商品文件包含模型与材质，不含灯光、相机或背景。<a href="../J003-blockout-v01.glb" download>下载草模 GLB</a> · <a href="https://modelviewer.dev/examples/scenegraph/" target="_blank" rel="noopener">查看器材质文档</a></footer></main>
<script>
const ring=document.querySelector('#ring'),status=document.querySelector('#status');
ring.addEventListener('load',()=>{const d=ring.getDimensions();document.querySelector('#dimensions').innerHTML=`${[d.x,d.y,d.z].map(v=>(v*1000).toFixed(2)).join(' × ')} mm<div class="small">完整模型外包尺寸 · 网页坐标</div>`;status.textContent='草模已加载 · 可旋转与缩放';});
ring.addEventListener('error',()=>status.textContent='加载失败，请检查本地文件与浏览器图形支持。');
document.querySelectorAll('[data-orbit]').forEach(b=>b.onclick=()=>{ring.cameraOrbit=b.dataset.orbit;ring.jumpCameraToGoal();document.querySelectorAll('[data-orbit]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));status.textContent=`${b.textContent}视角 · 可继续拖动观察`;});
function zoom(k){let o=ring.getCameraOrbit();ring.cameraOrbit=`${o.theta}rad ${o.phi}rad ${Math.min(.1,Math.max(.035,o.radius*k))}m`;ring.jumpCameraToGoal();status.textContent=`观察距离 ${(Math.min(.1,Math.max(.035,o.radius*k))*1000).toFixed(1)} mm`;}
document.querySelector('#in').onclick=()=>zoom(.85);document.querySelector('#out').onclick=()=>zoom(1.18);document.querySelector('#reset').onclick=()=>document.querySelector('[data-orbit]').click();
fetch('../J003-build-stats.json').then(r=>r.json()).then(s=>document.querySelector('#stats').innerHTML=`${(s.files['J003-blockout-v01.glb']/1e6).toFixed(2)} MB · ${s.triangles.toLocaleString()} 三角面<div class="small">${s.material_count_product} 个材质 · 无外部贴图</div>`);
</script></body></html>
